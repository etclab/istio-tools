# Data: latency
# Config: Talk with pods directly without istio
telemetry_mode: "no_istio"
conn:
    - 4
qps:
    - 500
    - 750
    - 1000
    - 1250
    - 1500

duration: 240
size: 1024
perf_record: true
del_perf_record: false

run_no_istio: true
run_bothsidecar: false
run_serversidecar: false
run_clientsidecar: false

extra_labels: "240s_w2"

uniform: true
nocatchup: true