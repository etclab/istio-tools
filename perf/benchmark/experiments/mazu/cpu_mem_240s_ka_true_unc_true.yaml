# Data: latency
# Config: Mazu: mtls enabled, both sidecars
telemetry_mode: "mazu"
conn:
    - 16
qps:
    - 20000
    - 32000
    - 50000
    - 60000
    - 80000
    - 100000

duration: 240
size: 1024
perf_record: true
del_perf_record: false

run_no_istio: false
run_bothsidecar: true
run_serversidecar: false
run_clientsidecar: false

extra_labels: "240s_ka_true_unc_true"

uniform: true
nocatchup: true