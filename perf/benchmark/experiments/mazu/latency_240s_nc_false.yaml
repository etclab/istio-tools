# Data: latency
# Config: Mazu: mtls enabled, both sidecars
telemetry_mode: "mazu"
conn:
    - 2
    - 4
    - 8 
    - 16
    - 32
    - 64
    - 128
    - 256
qps:
    - 1000

duration: 240
size: 1024
perf_record: true
del_perf_record: false

run_no_istio: false
run_bothsidecar: true
run_serversidecar: false
run_clientsidecar: false

extra_labels: "240s_nc_false"

uniform: true
nocatchup: false