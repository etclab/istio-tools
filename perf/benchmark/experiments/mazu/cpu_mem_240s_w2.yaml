# Data: latency
# Config: Mazu: mtls enabled, both sidecars
telemetry_mode: "mazu"
conn:
    - 4
qps:
    - 500
    - 750
    - 1000
    - 1250
    - 1500

duration: 240
size: 1024
perf_record: true
del_perf_record: false

run_no_istio: false
run_bothsidecar: true
run_serversidecar: false
run_clientsidecar: false

extra_labels: "240s_w2"

uniform: true
nocatchup: true