# Data: latency
# Config: Mazu: mtls enabled, both sidecars
telemetry_mode: "mazu"
conn:
    - 16
qps:
    - 100
    - 250
    - 500
    - 1000
    - 2000
    - 4000
    - 8000
    - 16000

duration: 120
size: 1024
perf_record: true
del_perf_record: false

run_no_istio: false
run_bothsidecar: true
run_serversidecar: false
run_clientsidecar: false

extra_labels: "120s"

uniform: true
nocatchup: true