# Data: latency
# Config: Mazu: mtls enabled, both sidecars
telemetry_mode: "mazu"
conn:
    - 64
qps:
    - 1000
    - 2000
    - 4000
    - 8000
    - 16000
    - 24000
    - 32000
    - 40000
    - 48000

duration: 240
size: 1024
perf_record: true
del_perf_record: false

run_no_istio: false
run_bothsidecar: true
run_serversidecar: false
run_clientsidecar: false

extra_labels: "240s_st2"

uniform: true
nocatchup: true

keepalive: true