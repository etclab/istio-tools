# Data: latency
# Config: plaintext
telemetry_mode: "istio_without_mtls"
conn:
    - 2
    - 4
    - 8
    - 16
    - 32
    - 64
qps:
    - 600
    - 800
    - 1000
    - 1200
    - 1400
duration: 240
perf_record: false
# we only care about both sidecar mode, which is the base line for mTLs overhead comparison.
run_bothsidecar: true
run_serversidecar: false
run_clientsidecar: false
run_baseline: false

extra_labels: "plaintext"

# jitter: true
uniform: true
nocatchup: true
